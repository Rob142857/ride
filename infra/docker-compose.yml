
services:

  osrm:

    image: osrm/osrm-backend@sha256:af5d4a83fb90086a43b1ae2ca22872e6768766ad5fcbb07a29ff90ec644ee409

    container_name: osrm

    restart: unless-stopped

    mem_limit: 2560m

    ports:

      - "127.0.0.1:5000:5000"

    volumes:

      - ./osrm-data:/data

    command: osrm-routed --algorithm mld --max-table-size 200 --max-trip-size 100 /data/data.osrm

    healthcheck:

      test: ["CMD", "curl", "-sf", "http://localhost:5000/nearest/v1/driving/151.2093,-33.8688"]

      interval: 30s

      timeout: 5s

      retries: 3



  graphhopper:

    image: israelhikingmap/graphhopper@sha256:3e79eb33862028cfc58f9d6c162630b68638d6aad790b5a698c854dbbaa7fe32

    container_name: graphhopper

    restart: unless-stopped

    mem_limit: 3.5g

    ports:

      - "127.0.0.1:8989:8989"

    volumes:

      - ./gh-data:/graphhopper/data

      - ./gh-config.yml:/graphhopper/config.yml:ro

    environment:

      - JAVA_OPTS=-Xmx3g -Xms1g

    command: -i /graphhopper/data/data.osm.pbf -c /graphhopper/config.yml -o /graphhopper/data/graph-cache

    healthcheck:

      test: ["CMD", "curl", "-sf", "http://localhost:8989/health"]

      interval: 30s

      timeout: 5s

      retries: 3

